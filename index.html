<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMBLINGFICADOR</title>

  <link rel="stylesheet" href="/src/style.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>

  <body>
    <!-- PANTALLA DE BIENVENIDA CON CÓDIGO -->
    <div id="welcome-screen">

      <div id="welcome-content">
        <h1>BIENVENIDO AL GAMBLINGFICADOR</h1>

        <p>Introduce el código de acceso</p>

        <form id="access-form">
          <input
            id="access-code"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="12"
            placeholder="Código numérico"
            autocomplete="off"
            required
          />

          <button id="start-btn" type="submit">
            ENTRAR
          </button>
        </form>

        <p id="access-error" role="alert" aria-live="polite"></p>
      </div>

    </div>

    <!-- CARGA DEL PROYECTO -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
