<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>GAMBLINGFICADOR</title>

<link rel="stylesheet" href="/src/style.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />

  <!-- INSTALABLE COMO APP (PWA) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#b58cf5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Gamblingficador" />

  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0QTVSJ4MHG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0QTVSJ4MHG');
</script>

</head>

  <body>
    <!-- PANTALLA DE BIENVENIDA CON CÓDIGO -->
    <div id="welcome-screen">

      <div id="welcome-content">
        <h1 data-i18n="welcome_titulo">BIENVENIDO AL GAMBLINGFICADOR</h1>

        <div id="lang-switch" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="es" class="activo">ESPAÑOL</button>
          <button type="button" data-lang="en">ENGLISH</button>
        </div>

        <p data-i18n="welcome_pide">Introduce el código de acceso</p>

        <form id="access-form">
          <input
            id="access-code"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="12"
            placeholder="Código numérico"
            data-i18n-ph="welcome_placeholder"
            autocomplete="off"
            required
          />

          <button id="start-btn" type="submit" data-i18n="welcome_entrar">
            ENTRAR
          </button>
        </form>

        <p id="access-error" role="alert" aria-live="polite"></p>
      </div>

    </div>

    <!-- SERVICE WORKER (solo en la web publicada, no en desarrollo) -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>

    <!-- CARGA DEL PROYECTO -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
