<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMBLIFICADOR</title>

  <script type="module" crossorigin src="/assets/index-C801QY_K.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DfeTSbl4.css">
</head>

  <body>
    <!-- PANTALLA DE BIENVENIDA CON CÓDIGO -->
    <div id="welcome-screen">

      <div id="welcome-content">
        <h1>BIENVENIDO AL GAMBLIFICADOR</h1>

        <p>Introduce el código de acceso</p>

        <form id="access-form">
          <input
            id="access-code"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="12"
            placeholder="Código numérico"
            autocomplete="off"
            required
          />

          <button id="start-btn" type="submit">
            ENTRAR
          </button>
        </form>

        <p id="access-error" role="alert" aria-live="polite"></p>
      </div>

    </div>

    <!-- CARGA DEL PROYECTO -->
  </body>
</html>
